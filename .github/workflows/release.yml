name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          # Release builds are one-shot; a warm cache buys little and would be
          # writable state feeding into a published artifact.
          cache: false

      # Every target is built on a runner of its own architecture, and the crate
      # is pure Rust, so plain cargo covers all four -- no cross/docker needed.
      # The musl targets link statically via Rust's bundled musl libc.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --bin cext --target "${TARGET}"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="cext-${TARGET}"
          mkdir -p dist
          # COPYFILE_DISABLE keeps bsdtar on macOS from adding ._ AppleDouble
          # entries for the binary's extended attributes.
          COPYFILE_DISABLE=1 tar czf "dist/${archive}.tar.gz" \
            -C "target/${TARGET}/release" cext
          # sha256sum is GNU coreutils; macOS runners only have shasum.
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${archive}.tar.gz" >"${archive}.sha256")
          else
            (cd dist && shasum -a 256 "${archive}.tar.gz" >"${archive}.sha256")
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cext-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: cext-*
          merge-multiple: true

      # One call with every asset already built, so the release is never
      # published in a half-uploaded state.
      # `gh release create` would cover this, but the action's upload retries and
      # per-asset error reporting are what make a four-asset release dependable.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
